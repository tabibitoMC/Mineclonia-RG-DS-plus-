# ==== Luanti para Anbernic RG DS Plus (configuracion de Nick) ====
# Juego por defecto
menu_last_game = mineclonia
default_game = mineclonia

# ---- Pantalla ----
video_driver = ogles2
fullscreen = true
screen_w = 1024
screen_h = 768
vsync = false
# 3D a menor resolucion (1 = nativa, 2 = mitad, mas FPS)
undersampling = 1
fps_max = 40
fps_max_unfocused = 40
gui_scaling = 1.6
hud_scaling = 1.4
font_size = 17
touch_controls = false
touch_gui = true

# ---- Rendimiento / poca RAM (1 GB) ----
viewing_range = 32
client_mapblock_limit = 700
client_unload_unused_data_timeout = 60
mesh_generation_threads = 2
enable_dynamic_shadows = false
enable_bloom = false
enable_volumetric_lighting = false
enable_post_processing = false
enable_auto_exposure = false
antialiasing = none
fsaa = 0
enable_waving_water = false
enable_waving_leaves = false
enable_waving_plants = false
enable_clouds = false
enable_3d_clouds = false
menu_clouds = false
smooth_lighting = false
mip_mapping = false
anisotropic_filter = false
bilinear_filter = false
trilinear_filter = false
enable_particles = true
enable_minimap = false
show_entity_selectionbox = false
connected_glass = false
opaque_water = true
leaves_style = opaque
translucent_liquids = false

# Servidor local (el mundo corre en la misma consola)
active_block_range = 2
active_object_send_range_blocks = 3
max_block_send_distance = 3
max_block_generate_distance = 3
max_simultaneous_block_sends_per_client = 6
num_emerge_threads = 1
server_unload_unused_data_timeout = 60
max_objects_per_block = 64

# Mineclonia: efectos que gastan mucho
animated_chests = false
mcl_damage_particles = false
fire_animation_frames = 4

# ---- Controles (SDL gamepad, posiciones) ----
# Botones: 0=abajo(B) 1=derecha(A) 2=izquierda(Y) 3=arriba(X)
# 4=SELECT 6=START 7=L3 9=L1 10=R1 11=Dpad arriba 12=abajo 13=izq 14=der
# Ejes: 0/1=stick, 4=L2, 5=R2
keymap_forward = GAMEPAD_AXIS_MINUS_1
keymap_backward = GAMEPAD_AXIS_PLUS_1
keymap_left = GAMEPAD_AXIS_MINUS_0
keymap_right = GAMEPAD_AXIS_PLUS_0
# Camara con A B X Y (como cruceta)
keymap_camera_pitch_up = GAMEPAD_BUTTON_3
keymap_camera_pitch_down = GAMEPAD_BUTTON_0
keymap_camera_yaw_left = GAMEPAD_BUTTON_2
keymap_camera_yaw_right = GAMEPAD_BUTTON_1
joystick_frustum_sensitivity = 110
# Acciones
keymap_dig = GAMEPAD_BUTTON_10
keymap_place = GAMEPAD_BUTTON_9
keymap_jump = GAMEPAD_AXIS_PLUS_5|GAMEPAD_BUTTON_11
keymap_sneak = GAMEPAD_AXIS_PLUS_4
keymap_drop = GAMEPAD_BUTTON_12
keymap_hotbar_previous = GAMEPAD_BUTTON_13
keymap_hotbar_next = GAMEPAD_BUTTON_14
keymap_inventory = GAMEPAD_BUTTON_4
keymap_pause = GAMEPAD_BUTTON_6
keymap_aux1 = GAMEPAD_BUTTON_7
# Quitar asignaciones de mando que chocan
keymap_zoom = SYSTEM_SCANCODE_29
keymap_minimap = SYSTEM_SCANCODE_25
keymap_freemove = SYSTEM_SCANCODE_14
keymap_screenshot = SYSTEM_SCANCODE_69
# Pantalla tactil de abajo como touchpad
touchpad_camera_sensitivity = 1.5

# Registro detallado en debug.txt (para diagnosticar)
debug_log_level = info

# Red local sin IPv6 (mas compatible)
enable_ipv6 = false
ipv6_server = false

# ---- Estilo Minecraft: fuente pixelada (Monocraft, licencia OFL) ----
font_path = fonts/Monocraft.ttf
font_path_bold = fonts/Monocraft.ttf
font_path_italic = fonts/Monocraft.ttf
font_path_bold_italic = fonts/Monocraft.ttf
mono_font_path = fonts/Monocraft.ttf
mono_font_path_bold = fonts/Monocraft.ttf
mono_font_path_italic = fonts/Monocraft.ttf
mono_font_path_bold_italic = fonts/Monocraft.ttf
font_shadow = 2
font_shadow_alpha = 160

# ---- Memoria (consola de 1 GB) ----
# Tamano maximo de letra: las letras gigantes gastan cientos de MB
font_size_max = 40
# Fuente de respaldo liviana (la original china pesa mucho en RAM)
fallback_font_path = fonts/Arimo-Regular.ttf
